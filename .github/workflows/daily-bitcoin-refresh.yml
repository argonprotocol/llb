name: Daily Bitcoin refresh and deploy

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitcoin-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    # Manual runs must also use the default branch before publishing production.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Refresh completed Bitcoin days
        run: yarn update:bitcoin

      - name: Test
        run: yarn test

      - name: Type check
        run: yarn exec vue-tsc -b

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: yarn build --base "${PAGES_BASE_PATH}/"

      - name: Commit refreshed data together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/bitcoinPrices.json src/data/bitcoinFees.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily Bitcoin history"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
